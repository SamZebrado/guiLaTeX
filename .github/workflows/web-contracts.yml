name: Web v1 contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standard-library Web contract suite
        run: python -m unittest discover -s tests -p "test_web_*.py"
